<!-- settings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Head content similar to orders page -->
</head>
<body>
  <!-- Include navbar and sidebar -->
  
  <div class="container mt-4">
    <h1>Settings</h1>
    
    <div class="row mt-4">
      <div class="col-md-3">
        <div class="list-group">
          <a href="#general" class="list-group-item list-group-item-action active" data-bs-toggle="list">General</a>
          <a href="#store" class="list-group-item list-group-item-action" data-bs-toggle="list">Store Settings</a>
          <a href="#payment" class="list-group-item list-group-item-action" data-bs-toggle="list">Payment Methods</a>
          <a href="#shipping" class="list-group-item list-group-item-action" data-bs-toggle="list">Shipping Options</a>
          <a href="#tax" class="list-group-item list-group-item-action" data-bs-toggle="list">Tax Settings</a>
          <a href="#emails" class="list-group-item list-group-item-action" data-bs-toggle="list">Email Templates</a>
        </div>
      </div>
      <div class="col-md-9">
        <div class="tab-content">
          <div class="tab-pane fade show active" id="general">
            <div class="card">
              <div class="card-header bg-dark text-white">General Settings</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label for="storeName" class="form-label">Store Name</label>
                    <input type="text" class="form-control" id="storeName" value="Synapse">
                  </div>
                  <div class="mb-3">
                    <label for="storeEmail" class="form-label">Store Email</label>
                    <input type="email" class="form-control" id="storeEmail" value="contact@synapse.com">
                  </div>
                  <div class="mb-3">
                    <label for="storePhone" class="form-label">Store Phone</label>
                    <input type="text" class="form-control" id="storePhone" value="555-123-4567">
                  </div>
                  <div class="mb-3">
                    <label for="storeCurrency" class="form-label">Currency</label>
                    <select class="form-select" id="storeCurrency">
                      <option selected>USD ($)</option>
                      <option>EUR (€)</option>
                      <option>GBP (£)</option>
                    </select>
                  </div>
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
              </div>
            </div>
          </div>
          
          <!-- Other tabs would go here -->
          <div class="tab-pane fade" id="store">
            <!-- Store settings content -->
          </div>
          <div class="tab-pane fade" id="payment">
            <!-- Payment settings content -->
          </div>
          <!-- And so on... -->
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
