<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      background-color: #6c757d;
      color: white;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
      font-weight: 500;
    }

    .list-group-item {
      border: none;
      border-radius: 0.375rem;
      color: #495057;
    }

    .list-group-item.active {
      background-color: #6c757d;
      border-color: #6c757d;
      color: white;
    }

    .form-control, .form-select {
      border-radius: 0.5rem;
    }

    .btn-primary {
      background-color: #6c757d;
      border: none;
      border-radius: 0.5rem;
    }

    .btn-primary:hover {
      background-color: #5c636a;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #343a40;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <h1 class="mb-4">Settings</h1>
    
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 mb-4">
        <div class="list-group shadow-sm">
          <a href="#general" class="list-group-item list-group-item-action active" data-bs-toggle="list">General</a>
          <a href="#store" class="list-group-item list-group-item-action" data-bs-toggle="list">Store Settings</a>
          <a href="#payment" class="list-group-item list-group-item-action" data-bs-toggle="list">Payment Methods</a>
          <a href="#shipping" class="list-group-item list-group-item-action" data-bs-toggle="list">Shipping Options</a>
          <a href="#tax" class="list-group-item list-group-item-action" data-bs-toggle="list">Tax Settings</a>
          <a href="#emails" class="list-group-item list-group-item-action" data-bs-toggle="list">Email Templates</a>
        </div>
      </div>

      <!-- Content -->
      <div class="col-md-9">
        <div class="tab-content">

          <!-- General Settings -->
          <div class="tab-pane fade show active" id="general">
            <div class="card">
              <div class="card-header">General Settings</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label class="form-label">Store Name</label>
                    <input type="text" class="form-control" value="Synapse">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Store Email</label>
                    <input type="email" class="form-control" value="contact@synapse.com">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" value="555-123-4567">
                  </div>
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Store Settings -->
          <div class="tab-pane fade" id="store">
            <div class="card">
              <div class="card-header">Store Settings</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label class="form-label">Store Status</label>
                    <select class="form-select">
                      <option>Open</option>
                      <option>Closed</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Maintenance Message</label>
                    <input type="text" class="form-control" placeholder="We’re updating our store...">
                  </div>
                  <button class="btn btn-primary">Save</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Payment Methods -->
          <div class="tab-pane fade" id="payment">
            <div class="card">
              <div class="card-header">Payment Methods</div>
              <div class="card-body">
                <form>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="mpesa" checked>
                    <label class="form-check-label" for="mpesa">Enable M-Pesa</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="paypal">
                    <label class="form-check-label" for="paypal">Enable PayPal</label>
                  </div>
                  <button class="btn btn-primary">Update Payment Methods</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Shipping Options -->
          <div class="tab-pane fade" id="shipping">
            <div class="card">
              <div class="card-header">Shipping Options</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label class="form-label">Default Shipping Rate</label>
                    <input type="number" class="form-control" value="300">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Free Shipping Threshold</label>
                    <input type="number" class="form-control" value="2000">
                  </div>
                  <button class="btn btn-primary">Save Shipping Settings</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Tax Settings -->
          <div class="tab-pane fade" id="tax">
            <div class="card">
              <div class="card-header">Tax Settings</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label class="form-label">VAT (%)</label>
                    <input type="number" class="form-control" value="16">
                  </div>
                  <button class="btn btn-primary">Save Tax Settings</button>
                </form>
              </div>
            </div>
          </div>

          <!-- Email Templates -->
          <div class="tab-pane fade" id="emails">
            <div class="card">
              <div class="card-header">Email Templates</div>
              <div class="card-body">
                <form>
                  <div class="mb-3">
                    <label class="form-label">Order Confirmation Subject</label>
                    <input type="text" class="form-control" value="Your order with Synapse is confirmed!">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Message Body</label>
                    <textarea class="form-control" rows="4">Thank you for shopping with us...</textarea>
                  </div>
                  <button class="btn btn-primary">Update Template</button>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
